name: Windows release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test and build Windows engine
        working-directory: engine
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked

      - name: Run engine loopback integration tests
        working-directory: engine/tests
        run: python -m unittest -v test_engine

      - name: Test Native Messaging host framing
        working-directory: engine/tests
        run: python -m unittest -v test_native_host

      - name: Build Tauri desktop application and NSIS installer
        working-directory: ui
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unsupported release tag: $env:GITHUB_REF_NAME" }
          $configPath = 'src-tauri/tauri.conf.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.version = $version
          $config | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 $configPath
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          npm ci
          npm run lint
          npm run tauri:build

      - name: Install and launch Windows application smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem ui/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Tauri NSIS installer was not produced.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'zex-dm-smoke'
          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
          if ($installProcess.ExitCode -ne 0) { throw "NSIS installer exited with $($installProcess.ExitCode)." }
          $app = Get-ChildItem -Path $installDir -Filter 'zex-download-manager.exe' -File -Recurse | Select-Object -First 1
          if (-not $app) { throw 'Installed Tauri application executable was not found.' }
          $process = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "Installed desktop app exited during startup (exit $($process.ExitCode))." }
          Stop-Process -Id $process.Id -Force

      - name: Test media parser
        working-directory: media
        run: python tests/run_tests.py

      - name: Validate extension sources
        shell: pwsh
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
          node --check extension/firefox/background.js
          node --check extension/firefox/popup.js
          python -m json.tool extension/manifest.json > $null
          python -m json.tool extension/firefox/manifest.json > $null

      - name: Prepare real release artifacts
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $stage = Join-Path $PWD 'release-stage'
          $cli = Join-Path $stage 'zex-download-manager-cli-windows-x64'
          New-Item -ItemType Directory -Force -Path $cli, (Join-Path $stage 'extension-chromium') | Out-Null
          Copy-Item engine/target/release/dm.exe (Join-Path $cli 'dm.exe')
          Copy-Item engine/target/release/dm-native-host.exe (Join-Path $cli 'dm-native-host.exe')
          Copy-Item (Get-ChildItem ui/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName (Join-Path $stage "zex-download-manager-setup-windows-x64-$version.exe")
          Copy-Item README.md, LICENSE (Join-Path $cli '.')
          Copy-Item CHANGELOG.md (Join-Path $cli 'CHANGELOG.md')
          python tools/generate-icons.py --out extension/icons
          Copy-Item extension/manifest.json, extension/background.js, extension/content.js, extension/popup.html, extension/popup.js, extension/popup.css (Join-Path $stage 'extension-chromium')
          Copy-Item extension/icons (Join-Path $stage 'extension-chromium/icons') -Recurse
          Compress-Archive -Path "$cli/*" -DestinationPath (Join-Path $stage "zex-download-manager-cli-windows-x64-$version.zip")
          Compress-Archive -Path (Join-Path $stage 'extension-chromium/*') -DestinationPath (Join-Path $stage "zex-download-manager-chromium-extension-$version.zip")
          Get-ChildItem $stage -File | Where-Object { $_.Extension -eq '.zip' -or $_.Extension -eq '.exe' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content -Encoding ascii (Join-Path $stage 'SHA256SUMS.txt')
          }
          "Development pre-release for $version. Includes the Tauri Windows desktop installer, standalone CLI/Native Messaging host ZIP, Chromium extension package, and SHA-256 checksums. Native Messaging pairing requires entering the installed Chromium extension ID in the app. Unsigned and not code-signed." | Set-Content -Encoding utf8 (Join-Path $stage 'RELEASE_NOTES.txt')

      - name: Publish development pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem release-stage -File | Where-Object { $_.Extension -eq '.zip' -or $_.Extension -eq '.exe' } | ForEach-Object { $_.FullName })
          $assets += (Join-Path $PWD 'release-stage/SHA256SUMS.txt')
          $assets += (Join-Path $PWD 'release-stage/RELEASE_NOTES.txt')
          gh release create $env:GITHUB_REF_NAME @assets --title "ZEX Download Manager $env:GITHUB_REF_NAME" --notes-file release-stage/RELEASE_NOTES.txt --prerelease

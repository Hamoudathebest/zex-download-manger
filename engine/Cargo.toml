[package]
name = "download-manager"
version = "0.1.0"
edition = "2021"
description = "Phase 1 download engine: parallel segmented HTTP/HTTPS downloads with pause/resume, throttle, retry and SHA-256 verification"
license = "MIT"

[[bin]]
name = "dm"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ctrlc = "3"
futures-util = "0.3"

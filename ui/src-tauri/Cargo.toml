[package]
name = "zex-download-manager"
version = "0.2.0"
description = "ZEX Download Manager desktop application"
authors = ["ZEX Download Manager contributors"]
edition = "2021"

[features]
e2e-debug-webview = []

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
url = "2"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
